<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="52" viewBox="0 0 1000 52" role="img" aria-label="scrolling tech keywords">
  <defs>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55"><animate attributeName="stop-color" values="#ff2d55;#00ff9d;#00d4ff;#b026ff;#ff9500;#ff2d55" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#b026ff;#ff2d55;#00ff9d;#ff9500;#00d4ff" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="kShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05060f" stop-opacity="1"/>
      <stop offset="10%" stop-color="#05060f" stop-opacity="0"/>
      <stop offset="90%" stop-color="#05060f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05060f" stop-opacity="1"/>
    </linearGradient>
    <filter id="kGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="kClip"><rect width="1000" height="52" rx="14"/></clipPath>
    <style>
      .kTrack { animation: kSlide 26s linear infinite; }
      @keyframes kSlide { from { transform: translateX(0) } to { transform: translateX(-1000px) } }
    </style>
  </defs>

  <rect width="1000" height="52" rx="14" fill="#05060f" stroke="url(#kGrad)" stroke-width="1.6"/>
  <g clip-path="url(#kClip)">
    <!-- shine sweep that keeps travelling across the tape -->
    <rect x="-260" y="0" width="260" height="52" fill="url(#kShine)">
      <animate attributeName="x" values="-260;1260" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <g class="kTrack" font-family="'Fira Code',Consolas,ui-monospace,monospace" font-size="15" fill="url(#kGrad)" filter="url(#kGlow)">
      <g>
        <text x="20" y="33" class="kItem">⚡ OHM'S LAW<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="0.00s" repeatCount="indefinite"/></text>
        <text x="173" y="33" class="kItem">▸ KIRCHHOFF<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="0.50s" repeatCount="indefinite"/></text>
        <text x="317" y="33" class="kItem">▸ PCB<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="1.00s" repeatCount="indefinite"/></text>
        <text x="407" y="33" class="kItem">▸ ARDUINO<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="1.50s" repeatCount="indefinite"/></text>
        <text x="533" y="33" class="kItem">▸ ESP32<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="2.00s" repeatCount="indefinite"/></text>
        <text x="641" y="33" class="kItem">▸ MQTT<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="2.50s" repeatCount="indefinite"/></text>
        <text x="740" y="33" class="kItem">▸ SENSORS<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="3.00s" repeatCount="indefinite"/></text>
        <text x="866" y="33" class="kItem">▸ SERVO<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="3.50s" repeatCount="indefinite"/></text>
      </g>
      <g transform="translate(1000,0)">
        <text x="20" y="33" class="kItem">⚡ OHM'S LAW<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="0.00s" repeatCount="indefinite"/></text>
        <text x="173" y="33" class="kItem">▸ KIRCHHOFF<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="0.50s" repeatCount="indefinite"/></text>
        <text x="317" y="33" class="kItem">▸ PCB<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="1.00s" repeatCount="indefinite"/></text>
        <text x="407" y="33" class="kItem">▸ ARDUINO<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="1.50s" repeatCount="indefinite"/></text>
        <text x="533" y="33" class="kItem">▸ ESP32<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="2.00s" repeatCount="indefinite"/></text>
        <text x="641" y="33" class="kItem">▸ MQTT<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="2.50s" repeatCount="indefinite"/></text>
        <text x="740" y="33" class="kItem">▸ SENSORS<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="3.00s" repeatCount="indefinite"/></text>
        <text x="866" y="33" class="kItem">▸ SERVO<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="3.50s" repeatCount="indefinite"/></text>
      </g>
      <g transform="translate(2000,0)">
        <text x="20" y="33" class="kItem">⚡ OHM'S LAW<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="0.00s" repeatCount="indefinite"/></text>
        <text x="173" y="33" class="kItem">▸ KIRCHHOFF<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="0.50s" repeatCount="indefinite"/></text>
        <text x="317" y="33" class="kItem">▸ PCB<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="1.00s" repeatCount="indefinite"/></text>
        <text x="407" y="33" class="kItem">▸ ARDUINO<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="1.50s" repeatCount="indefinite"/></text>
        <text x="533" y="33" class="kItem">▸ ESP32<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="2.00s" repeatCount="indefinite"/></text>
        <text x="641" y="33" class="kItem">▸ MQTT<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="2.50s" repeatCount="indefinite"/></text>
        <text x="740" y="33" class="kItem">▸ SENSORS<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="3.00s" repeatCount="indefinite"/></text>
        <text x="866" y="33" class="kItem">▸ SERVO<animate attributeName="fill-opacity" values="0.72;1;0.72" dur="4.4s" begin="3.50s" repeatCount="indefinite"/></text>
      </g>
    </g>
  </g>
  <rect width="1000" height="52" rx="14" fill="url(#kFade)" pointer-events="none"/>
</svg>
