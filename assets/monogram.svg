<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260" role="img" aria-label="LJ monogram with RGB ring">
  <defs>
    <linearGradient id="mRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"><animate attributeName="stop-color" values="#ff2d55;#ff9500;#00ff9d;#00d4ff;#b026ff;#ff2d55" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#b026ff;#ff2d55;#ff9500;#00ff9d;#00d4ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00ff9d"><animate attributeName="stop-color" values="#00ff9d;#00d4ff;#b026ff;#ff2d55;#ff9500;#00ff9d" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="mText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"><animate attributeName="stop-color" values="#ff2d55;#00ff9d;#00d4ff;#b026ff;#ff2d55" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#ff2d55;#00ff9d;#b026ff;#00d4ff" dur="5s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="mGlow"><stop offset="0%" stop-color="#00d4ff" stop-opacity="0.45"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
    <filter id="mBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="130" cy="130" r="120" fill="#05060f"/>
  <circle cx="130" cy="130" r="126" fill="url(#mGlow)"/>

  <!-- radar pings that ripple outwards (automatic, no hover needed) -->
  <g fill="none" stroke="url(#mRing)" stroke-width="1.6">
    <circle cx="130" cy="130" r="76" opacity="0">
      <animate attributeName="r" values="76;124" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="130" r="76" opacity="0">
      <animate attributeName="r" values="76;124" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="130" r="76" opacity="0">
      <animate attributeName="r" values="76;124" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- rotating dashed rings -->
  <circle cx="130" cy="130" r="112" fill="none" stroke="url(#mRing)" stroke-width="3" stroke-dasharray="26 12" filter="url(#mBlur)">
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="130" r="100" fill="none" stroke="url(#mRing)" stroke-width="1.4" stroke-dasharray="3 9" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting electron dots -->
  <g>
    <circle r="5" fill="#ff2d55" filter="url(#mBlur)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M130,18 A112,112 0 1,1 129.9,18"/>
    </circle>
    <circle r="4" fill="#00ff9d" filter="url(#mBlur)">
      <animateMotion dur="9s" begin="1s" repeatCount="indefinite" path="M130,30 A100,100 0 1,0 129.9,30"/>
    </circle>
    <circle r="4" fill="#b026ff" filter="url(#mBlur)">
      <animateMotion dur="11s" begin="2.5s" repeatCount="indefinite" path="M130,18 A112,112 0 1,0 129.9,18"/>
    </circle>
  </g>

  <!-- core -->
  <g>
    <circle cx="130" cy="130" r="76" fill="#0a0c1c" stroke="url(#mRing)" stroke-width="2"/>
    <text x="130" y="150" text-anchor="middle" font-family="'Fira Code',Consolas,ui-monospace,monospace" font-size="62" font-weight="700" fill="url(#mText)">LJ</text>
    <text x="130" y="178" text-anchor="middle" font-family="'Fira Code',Consolas,ui-monospace,monospace" font-size="10" letter-spacing="2.5" fill="#7f8fbb">EE · 2K25</text>
  </g>

  <!-- corner ticks -->
  <g stroke="url(#mRing)" stroke-width="2" stroke-linecap="round">
    <path d="M22,40 V22 H40"/><path d="M220,22 H238 V40"/><path d="M238,220 V238 H220"/><path d="M40,238 H22 V220"/>
  </g>
</svg>
