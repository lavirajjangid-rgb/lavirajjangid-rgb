<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="42" viewBox="0 0 1000 42" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0">
        <animate attributeName="stop-color" values="#ff2d55;#00ff9d;#00d4ff;#b026ff;#ff2d55" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="20%" stop-color="#ff2d55">
        <animate attributeName="stop-color" values="#ff2d55;#ff9500;#00ff9d;#00d4ff;#b026ff;#ff2d55" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#b026ff;#ff2d55;#ff9500;#00ff9d;#00d4ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#00ff9d">
        <animate attributeName="stop-color" values="#00ff9d;#00d4ff;#b026ff;#ff2d55;#ff9500;#00ff9d" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b026ff" stop-opacity="0">
        <animate attributeName="stop-color" values="#b026ff;#ff2d55;#ff9500;#00ff9d;#00d4ff;#b026ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="dGlow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .dBeam { animation: dPulse 4.5s ease-in-out infinite; transform-origin: center; }
      @keyframes dPulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
    </style>
  </defs>

  <!-- main beam -->
  <g class="dBeam" filter="url(#dGlow)">
    <path d="M0,21 H1000" stroke="url(#dLine)" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- travelling pulses -->
  <g filter="url(#dGlow)">
    <circle cy="21" r="3.2" fill="#ff2d55">
      <animate attributeName="cx" values="-30;1030" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cy="21" r="3.2" fill="#00ff9d">
      <animate attributeName="cx" values="1030;-30" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cy="21" r="2.6" fill="#00d4ff">
      <animate attributeName="cx" values="-30;1030" dur="8s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cy="21" r="2.6" fill="#b026ff">
      <animate attributeName="cx" values="1030;-30" dur="9s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="9s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- sine wave -->
  <path d="M0,21 Q25,4 50,21 T100,21 T150,21 T200,21 T250,21 T300,21 T350,21 T400,21 T450,21 T500,21 T550,21 T600,21 T650,21 T700,21 T750,21 T800,21 T850,21 T900,21 T950,21 T1000,21"
        fill="none" stroke="#4d5b8a" stroke-opacity="0.5" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- center jewel -->
  <g transform="translate(500,21)">
    <circle r="7" fill="none" stroke="#00d4ff" stroke-opacity="0.8" stroke-width="1.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="4 8;18 6;4 8" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#00ff9d"><animate attributeName="r" values="2.4;4;2.4" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
