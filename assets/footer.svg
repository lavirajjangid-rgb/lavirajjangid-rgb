<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Animated RGB footer waves">
  <defs>
    <linearGradient id="fRgb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55"><animate attributeName="stop-color" values="#ff2d55;#ff9500;#00ff9d;#00d4ff;#b026ff;#ff2d55" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#00ff9d"><animate attributeName="stop-color" values="#00ff9d;#00d4ff;#b026ff;#ff2d55;#ff9500;#00ff9d" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#b026ff;#ff2d55;#ff9500;#00ff9d;#00d4ff" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="fWaveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.75"/><stop offset="50%" stop-color="#b026ff" stop-opacity="0.75"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="fWaveB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.55"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="fRail"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="fGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="fClip"><rect x="2" y="2" width="996" height="206" rx="20"/></clipPath>
    <style>
      .wA { animation: fScroll 9s linear infinite; }
      .wB { animation: fScroll 14s linear infinite reverse; }
      @keyframes fScroll { from { transform: translateX(0) } to { transform: translateX(-500px) } }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="206" rx="20" fill="#05060f"/>
  <g clip-path="url(#fClip)">
    <!-- waves -->
    <g fill="none" stroke-width="2.6" filter="url(#fGlow)">
      <g class="wA">
        <path d="M0,120 Q62.5,86 125,120 T250,120 T375,120 T500,120 T625,120 T750,120 T875,120 T1000,120 T1125,120 T1250,120 T1375,120 T1500,120" stroke="url(#fWaveA)"/>
      </g>
      <g class="wB">
        <path d="M0,140 Q62.5,178 125,140 T250,140 T375,140 T500,140 T625,140 T750,140 T875,140 T1000,140 T1125,140 T1250,140 T1375,140 T1500,140" stroke="url(#fWaveB)"/>
      </g>
    </g>

    <!-- footer text -->
    <text x="500" y="62" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif" font-size="26" font-weight="700" fill="url(#fRgb)">KEEP THE CURRENT FLOWING ⚡</text>
    <text x="500" y="88" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="12.5" fill="#94a6cd">Learn → Build → Break → Fix → Repeat. That is literally the whole job.</text>

    <!-- chips, pulsing in sequence -->
    <g font-family="Consolas,ui-monospace,monospace" font-size="11.5" fill="#cfdcff" text-anchor="middle">
      <g>
        <rect x="250" y="100" width="150" height="28" rx="14" fill="#0b1024" stroke="#ff2d55" stroke-opacity="0.7"/>
        <rect x="250" y="100" width="150" height="28" rx="14" fill="none" stroke="#ff2d55" stroke-opacity="0">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.2s" begin="0s" repeatCount="indefinite"/></rect>
        <text x="325" y="119">⚡ EE · 2nd Year</text>
      </g>
      <g>
        <rect x="412" y="100" width="176" height="28" rx="14" fill="#0b1024" stroke="#00ff9d" stroke-opacity="0.7"/>
        <rect x="412" y="100" width="176" height="28" rx="14" fill="none" stroke="#00ff9d" stroke-opacity="0">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.2s" begin="0.7s" repeatCount="indefinite"/></rect>
        <text x="500" y="119">📡 IoT Builder</text>
      </g>
      <g>
        <rect x="600" y="100" width="150" height="28" rx="14" fill="#0b1024" stroke="#00d4ff" stroke-opacity="0.7"/>
        <rect x="600" y="100" width="150" height="28" rx="14" fill="none" stroke="#00d4ff" stroke-opacity="0">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.2s" begin="1.4s" repeatCount="indefinite"/></rect>
        <text x="675" y="119">🤖 Robotics</text>
      </g>
    </g>

    <!-- surge spark that keeps running along the rail -->
    <circle cy="176" r="26" fill="url(#fRail)">
      <animate attributeName="cx" values="60;940;940" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.55;0.7" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- rail sparks -->
    <g>
      <circle cx="120" cy="176" r="3" fill="#ff2d55"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="184" r="2.6" fill="#00ff9d"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="172" r="3" fill="#00d4ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="186" r="2.6" fill="#b026ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="176" r="3" fill="#ff9500"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect x="2" y="2" width="996" height="206" rx="20" fill="none" stroke="url(#fRgb)" stroke-width="2.4"/>
</svg>
