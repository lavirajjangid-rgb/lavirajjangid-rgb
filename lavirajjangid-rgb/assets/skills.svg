<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="466" viewBox="0 0 1000 466" role="img" aria-label="Animated RGB skill bars">
  <defs>
    <linearGradient id="sEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"><animate attributeName="stop-color" values="#ff2d55;#00ff9d;#00d4ff;#b026ff;#ff2d55" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#b026ff;#ff2d55;#00ff9d;#00d4ff" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="sA" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff2d55"/><stop offset="100%" stop-color="#ff9500"/></linearGradient>
    <linearGradient id="sB" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00ff9d"/><stop offset="100%" stop-color="#00d4ff"/></linearGradient>
    <linearGradient id="sC" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#b026ff"/></linearGradient>
    <linearGradient id="sD" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#b026ff"/><stop offset="100%" stop-color="#ff2d55"/></linearGradient>
    <linearGradient id="sScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sGlow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sClip"><rect x="2" y="2" width="996" height="462" rx="20"/></clipPath>
  </defs>

  <rect x="2" y="2" width="996" height="462" rx="20" fill="#05060f"/>
  <g clip-path="url(#sClip)">
    <g stroke="#101733" stroke-width="1">
      <path d="M0,60 H1000 M0,110 H1000 M0,160 H1000 M0,210 H1000 M0,260 H1000 M0,310 H1000 M0,360 H1000"/>
    </g>
    <line x1="250" y1="72" x2="250" y2="410" stroke="#1b2340"/>
    <line x1="418" y1="72" x2="418" y2="410" stroke="#131b38" stroke-dasharray="4 6"/>
    <line x1="586" y1="72" x2="586" y2="410" stroke="#131b38" stroke-dasharray="4 6"/>
    <line x1="754" y1="72" x2="754" y2="410" stroke="#131b38" stroke-dasharray="4 6"/>
    <line x1="922" y1="72" x2="922" y2="410" stroke="#131b38" stroke-dasharray="4 6"/>

    <text x="34" y="38" font-family="Consolas,ui-monospace,monospace" font-size="16" font-weight="700" fill="#e8f0ff" letter-spacing="1.5">⚡ SKILL LEVEL</text>
    <text x="34" y="60" font-family="Consolas,ui-monospace,monospace" font-size="11" fill="#6d7ca8">self-rated · updated monthly</text>
    <g font-family="Consolas,ui-monospace,monospace" font-size="10.5" fill="#6d7ca8" text-anchor="middle">
      <text x="250" y="66">0%</text>
      <text x="418" y="66">25%</text>
      <text x="586" y="66">50%</text>
      <text x="754" y="66">75%</text>
      <text x="922" y="66">100%</text>
    </g>
    <line x1="240" y1="72" x2="976" y2="72" stroke="#1b2340"/>

    <!-- helper: track x=250 -> 922 (672px). bar width = pct * 6.72 -->
    <g font-family="Consolas,ui-monospace,monospace" font-size="13.5" transform="translate(0,34)">
      <!-- C -->
      <g>
        <text x="34" y="84" fill="#c8d4f0">C programming</text>
        <rect x="250" y="70" width="672" height="16" rx="8" fill="#0c1226" stroke="#1d2749"/>
        <rect x="250" y="70" height="16" rx="8" fill="url(#sA)" filter="url(#sGlow)" width="0">
          <animate attributeName="width" values="0;524" dur="1.5s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
        </rect>
        <rect x="250" y="70" width="524" height="16" rx="8" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;0;0.22;0.22;0" keyTimes="0;0.04;0.1;0.18;1" dur="8s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <text x="250" y="102" fill="#6d7ca8" font-size="10.5">pointers, arrays, embedded basics</text>
      </g>
      <!-- Python -->
      <g>
        <text x="34" y="134" fill="#c8d4f0">Python</text>
        <rect x="250" y="120" width="672" height="16" rx="8" fill="#0c1226" stroke="#1d2749"/>
        <rect x="250" y="120" height="16" rx="8" fill="url(#sB)" filter="url(#sGlow)" width="0">
          <animate attributeName="width" values="0;551" dur="1.5s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
        </rect>
        <rect x="250" y="120" width="551" height="16" rx="8" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;0;0.22;0.22;0" keyTimes="0;0.04;0.1;0.18;1" dur="8s" begin="0.5s" repeatCount="indefinite"/>
        </rect>
        <text x="250" y="152" fill="#6d7ca8" font-size="10.5">scripts, data logging, automation</text>
      </g>
      <!-- Arduino -->
      <g>
        <text x="34" y="184" fill="#c8d4f0">Arduino / Embedded C</text>
        <rect x="250" y="170" width="672" height="16" rx="8" fill="#0c1226" stroke="#1d2749"/>
        <rect x="250" y="170" height="16" rx="8" fill="url(#sC)" filter="url(#sGlow)" width="0">
          <animate attributeName="width" values="0;470" dur="1.5s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
        </rect>
        <rect x="250" y="170" width="470" height="16" rx="8" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;0;0.22;0.22;0" keyTimes="0;0.04;0.1;0.18;1" dur="8s" begin="1s" repeatCount="indefinite"/>
        </rect>
        <text x="250" y="202" fill="#6d7ca8" font-size="10.5">pins, PWM, sensors, servos</text>
      </g>
      <!-- IoT -->
      <g>
        <text x="34" y="234" fill="#c8d4f0">IoT (ESP8266 / ESP32)</text>
        <rect x="250" y="220" width="672" height="16" rx="8" fill="#0c1226" stroke="#1d2749"/>
        <rect x="250" y="220" height="16" rx="8" fill="url(#sD)" filter="url(#sGlow)" width="0">
          <animate attributeName="width" values="0;437" dur="1.5s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
        </rect>
        <rect x="250" y="220" width="437" height="16" rx="8" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;0;0.22;0.22;0" keyTimes="0;0.04;0.1;0.18;1" dur="8s" begin="1.5s" repeatCount="indefinite"/>
        </rect>
        <text x="250" y="252" fill="#6d7ca8" font-size="10.5">Wi-Fi, MQTT, cloud dashboards</text>
      </g>
      <!-- Circuit design -->
      <g>
        <text x="34" y="284" fill="#c8d4f0">Circuit design &amp; simulation</text>
        <rect x="250" y="270" width="672" height="16" rx="8" fill="#0c1226" stroke="#1d2749"/>
        <rect x="250" y="270" height="16" rx="8" fill="url(#sB)" filter="url(#sGlow)" width="0">
          <animate attributeName="width" values="0;403" dur="1.5s" begin="1.2s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
        </rect>
        <rect x="250" y="270" width="403" height="16" rx="8" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;0;0.22;0.22;0" keyTimes="0;0.04;0.1;0.18;1" dur="8s" begin="2s" repeatCount="indefinite"/>
        </rect>
        <text x="250" y="302" fill="#6d7ca8" font-size="10.5">Tinkercad, KiCad, breadboard, DMM</text>
      </g>
      <!-- Robotics -->
      <g>
        <text x="34" y="334" fill="#c8d4f0">Robotics &amp; automation</text>
        <rect x="250" y="320" width="672" height="16" rx="8" fill="#0c1226" stroke="#1d2749"/>
        <rect x="250" y="320" height="16" rx="8" fill="url(#sA)" filter="url(#sGlow)" width="0">
          <animate attributeName="width" values="0;369" dur="1.5s" begin="1.45s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
        </rect>
        <rect x="250" y="320" width="369" height="16" rx="8" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;0;0.22;0.22;0" keyTimes="0;0.04;0.1;0.18;1" dur="8s" begin="2.5s" repeatCount="indefinite"/>
        </rect>
        <text x="250" y="352" fill="#6d7ca8" font-size="10.5">line follower, obstacle bot, servo arms</text>
      </g>
      <!-- Git -->
      <g>
        <text x="34" y="384" fill="#c8d4f0">Git · GitHub · Docs</text>
        <rect x="250" y="370" width="672" height="16" rx="8" fill="#0c1226" stroke="#1d2749"/>
        <rect x="250" y="370" height="16" rx="8" fill="url(#sC)" filter="url(#sGlow)" width="0">
          <animate attributeName="width" values="0;336" dur="1.5s" begin="1.7s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
        </rect>
        <rect x="250" y="370" width="336" height="16" rx="8" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;0;0.22;0.22;0" keyTimes="0;0.04;0.1;0.18;1" dur="8s" begin="3s" repeatCount="indefinite"/>
        </rect>
        <text x="250" y="402" fill="#6d7ca8" font-size="10.5">commits every week (streak incoming)</text>
      </g>
    </g>

    <!-- scan line sweeping the chart every 8s -->
    <rect x="250" y="72" width="672" height="3" fill="url(#sScan)" opacity="0">
      <animate attributeName="y" values="72;410;410" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0;0" keyTimes="0;0.04;0.46;0.52;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="2" y="2" width="996" height="462" rx="20" fill="none" stroke="url(#sEdge)" stroke-width="2.4"/>
</svg>
