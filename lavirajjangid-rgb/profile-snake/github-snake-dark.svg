<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Snake animation placeholder - run the Generate Snake workflow once">
  <defs>
    <linearGradient id="snG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55"><animate attributeName="stop-color" values="#ff2d55;#00ff9d;#00d4ff;#b026ff;#ff2d55" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#b026ff;#ff2d55;#00ff9d;#00d4ff" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="snCell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.9"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="snGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .snCell { animation: snPulse 2.6s ease-in-out infinite; }
      @keyframes snPulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      .snGrid { animation: snSlide 9s linear infinite; }
      @keyframes snSlide { from { transform: translateX(0) } to { transform: translateX(-40px) } }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="186" rx="18" fill="#05060f"/>
  <rect x="2" y="2" width="996" height="186" rx="18" fill="none" stroke="url(#snG)" stroke-width="2.2"/>

  <!-- fake contribution grid -->
  <g class="snGrid" opacity="0.75">
    <g fill="url(#snCell)">
      <rect x="40"  y="96" width="16" height="16" rx="3"/><rect x="80"  y="96" width="16" height="16" rx="3"/>
      <rect x="120" y="96" width="16" height="16" rx="3"/><rect x="160" y="96" width="16" height="16" rx="3"/>
      <rect x="200" y="96" width="16" height="16" rx="3"/><rect x="240" y="96" width="16" height="16" rx="3"/>
      <rect x="280" y="96" width="16" height="16" rx="3"/><rect x="320" y="96" width="16" height="16" rx="3"/>
      <rect x="360" y="96" width="16" height="16" rx="3"/><rect x="400" y="96" width="16" height="16" rx="3"/>
      <rect x="440" y="96" width="16" height="16" rx="3"/><rect x="480" y="96" width="16" height="16" rx="3"/>
      <rect x="520" y="96" width="16" height="16" rx="3"/><rect x="560" y="96" width="16" height="16" rx="3"/>
      <rect x="600" y="96" width="16" height="16" rx="3"/><rect x="640" y="96" width="16" height="16" rx="3"/>
      <rect x="680" y="96" width="16" height="16" rx="3"/><rect x="720" y="96" width="16" height="16" rx="3"/>
      <rect x="760" y="96" width="16" height="16" rx="3"/><rect x="800" y="96" width="16" height="16" rx="3"/>
      <rect x="840" y="96" width="16" height="16" rx="3"/><rect x="880" y="96" width="16" height="16" rx="3"/>
      <rect x="920" y="96" width="16" height="16" rx="3"/>
    </g>
  </g>

  <!-- snake made of dots, slithering across the grid -->
  <g filter="url(#snGlow)">
    <circle r="9" fill="#00ff9d">
      <animateMotion dur="5s" repeatCount="indefinite" path="M60,104 H940 H60"/>
    </circle>
    <circle r="8" fill="#00d4ff" opacity="0.85">
      <animateMotion dur="5s" begin="-0.18s" repeatCount="indefinite" path="M60,104 H940 H60"/>
    </circle>
    <circle r="7" fill="#b026ff" opacity="0.7">
      <animateMotion dur="5s" begin="-0.36s" repeatCount="indefinite" path="M60,104 H940 H60"/>
    </circle>
  </g>

  <text x="500" y="46" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif" font-size="22" font-weight="700" fill="url(#snG)">🐍 THE SNAKE IS WARMING UP</text>
  <text x="500" y="72" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="12.5" fill="#94a6cd">Run the "🐍 Generate Snake" workflow once (Actions tab) and this card is replaced by the real snake eating your contributions.</text>
  <text x="500" y="150" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="11" fill="#6d7ca8">target file: profile-snake/github-snake-dark.svg · the workflow overwrites it automatically</text>
</svg>
