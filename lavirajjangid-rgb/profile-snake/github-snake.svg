<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Snake animation placeholder (light mode)">
  <defs>
    <linearGradient id="snlG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d40b3c"><animate attributeName="stop-color" values="#d40b3c;#008f57;#0072a3;#7a12c9;#d40b3c" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#0072a3"><animate attributeName="stop-color" values="#0072a3;#7a12c9;#d40b3c;#008f57;#0072a3" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="snlGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="996" height="186" rx="18" fill="#ffffff"/>
  <rect x="2" y="2" width="996" height="186" rx="18" fill="none" stroke="url(#snlG)" stroke-width="2.2"/>

  <g opacity="0.5" fill="#8cd7ba">
    <rect x="40" y="96" width="16" height="16" rx="3"/><rect x="120" y="96" width="16" height="16" rx="3"/>
    <rect x="200" y="96" width="16" height="16" rx="3"/><rect x="280" y="96" width="16" height="16" rx="3"/>
    <rect x="360" y="96" width="16" height="16" rx="3"/><rect x="440" y="96" width="16" height="16" rx="3"/>
    <rect x="520" y="96" width="16" height="16" rx="3"/><rect x="600" y="96" width="16" height="16" rx="3"/>
    <rect x="680" y="96" width="16" height="16" rx="3"/><rect x="760" y="96" width="16" height="16" rx="3"/>
    <rect x="840" y="96" width="16" height="16" rx="3"/><rect x="920" y="96" width="16" height="16" rx="3"/>
  </g>

  <g filter="url(#snlGlow)">
    <circle r="9" fill="#008f57"><animateMotion dur="5s" repeatCount="indefinite" path="M60,104 H940 H60"/></circle>
    <circle r="8" fill="#0072a3" opacity="0.85"><animateMotion dur="5s" begin="-0.18s" repeatCount="indefinite" path="M60,104 H940 H60"/></circle>
    <circle r="7" fill="#7a12c9" opacity="0.7"><animateMotion dur="5s" begin="-0.36s" repeatCount="indefinite" path="M60,104 H940 H60"/></circle>
  </g>

  <text x="500" y="46" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif" font-size="22" font-weight="700" fill="url(#snlG)">🐍 THE SNAKE IS WARMING UP</text>
  <text x="500" y="72" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="12.5" fill="#4b5563">Run the "🐍 Generate Snake" workflow once (Actions tab) and this card is replaced by the real snake.</text>
</svg>
